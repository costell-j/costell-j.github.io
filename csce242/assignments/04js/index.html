<!DOCTYPE html>
<html>
    <head>
        <title>Intro to JavaScript</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>Assignment 4</h1>
        </header>
        <main>
            <h3>Intro to JavaScript</h3>
            <div id="boxes">
                <a href="#">
                    <div class="content"  id="speech">
                        <h4>Speech</h4>
                        <div id="bubble-container">
                            <div id="bubble-body" class="hidden">Hi there.</div>
                            <div id="bubble-tail" class="hidden"></div>
                        </div>
                    </div>
                </a>
                <div class="content">
                    <h4>Beverage</h4>
                    <p>Pick your morning beverage: </p>
                    <select id="drinks" name="drinks">
                        <option value="coffee">Coffee</option>
                        <option value="orange-juice">Orange Juice</option>
                        <option value="apple-juice">Apple Juice</option>
                        <option value="milk">Milk</option>
                        <option value="water">Water</option>

                    </select>
                    <menu></menu>
                    <p id="responses"></p>
                </div>
                <div class="content" id="potato"> 
                    <h4>Add a Sticker</h4>
                    <a href="#">
                        <div id="image-container">
                            <img src="potato.jpg">
                            <span id="sticker" class="hidden">✨</span>
                        </div>
                    </a>
                </div>
            </div>
        </main>
        <footer>
            <p>&copy costell-j</p>
        </footer>
        <script src="index.js"></script>
    </body>
</html>
